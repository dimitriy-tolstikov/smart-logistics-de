x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: ["bonus"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_USER:-airflow}:${AIRFLOW_META_PASSWORD:-airflow}@airflow-meta:5432/${AIRFLOW_META_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-_GsWCOPSw9DYDLNo7sdnE2Vv9VPXAJTTIHAF0uQE1YE=}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    UL_PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-deals_bigdata}
    PGHOST: db
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER:-postgres}
    PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    PGDATABASE: ${POSTGRES_DB:-deals_bigdata}
    AS_OF_DATE: ${AS_OF_DATE:-2026-10-26}
    ETL_START_DATE: ${ETL_START_DATE:-2019-01-01}
    ETL_END_DATE: ${ETL_END_DATE:-2027-12-31}
    ML_RANDOM_SEED: ${ML_RANDOM_SEED:-42}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-meta:
      condition: service_healthy

services:
  db:
    image: postgres:17
    container_name: ul-de-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./sql/dwh:/sql/dwh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deals_bigdata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ul-de-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-deals_bigdata}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-deals_bigdata}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-deals_bigdata}
      N_PRICES: ${N_PRICES:-300000}
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-26}
      ETL_START_DATE: ${ETL_START_DATE:-2019-01-01}
      ETL_END_DATE: ${ETL_END_DATE:-2027-12-31}
      ML_RANDOM_SEED: ${ML_RANDOM_SEED:-42}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      # Off by default so mandatory `compose up` does not require ClickHouse.
      CLICKHOUSE_SYNC_ENABLED: ${CLICKHOUSE_SYNC_ENABLED:-0}
    volumes:
      - ./:/app
    command: ["/app/docker/entrypoint.sh"]

  # --- bonus ★ profile ---

  clickhouse:
    profiles: ["bonus"]
    image: clickhouse/clickhouse-server:24.8
    container_name: ul-de-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password ${CLICKHOUSE_PASSWORD:-clickhouse} -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-meta:
    profiles: ["bonus"]
    image: postgres:17
    container_name: ul-de-airflow-meta
    environment:
      POSTGRES_USER: ${AIRFLOW_META_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_META_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_META_DB:-airflow}
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_META_USER:-airflow} -d ${AIRFLOW_META_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: ul-de-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins} 2>/dev/null || true
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    user: "0:0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: ul-de-airflow-web
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: ul-de-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  superset-db:
    profiles: ["bonus"]
    image: postgres:17
    container_name: ul-de-superset-db
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
    volumes:
      - superset_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER:-superset} -d ${SUPERSET_DB_NAME:-superset}"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset-init:
    profiles: ["bonus"]
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: ul-de-superset-init
    command: ["/app/docker/bootstrap.sh"]
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-ul_local_superset_secret_change_me}
      DATABASE_URL: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_POSTGRES_URI: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-deals_bigdata}
      SUPERSET_CLICKHOUSE_URI: clickhousedb://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:8123/${CLICKHOUSE_DB:-default}
    depends_on:
      superset-db:
        condition: service_healthy
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  superset:
    profiles: ["bonus"]
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    container_name: ul-de-superset
    command: ["/bin/sh", "-c", "superset run -h 0.0.0.0 -p 8088 --with-threads"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    environment:
      <<: *superset-env
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
  airflow_pgdata:
  superset_pgdata:
